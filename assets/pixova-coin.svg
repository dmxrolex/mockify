    </linearGradient>
    <filter id="px-logo-relief" x="-.3" y="-.3" width="1.6" height="1.7" color-interpolation-filters="sRGB">
      <feDropShadow dx="1" dy="3.8" stdDeviation="2.2" flood-color="#7d3300" flood-opacity=".65"/>
    </filter>
    <filter id="px-coin-shadow" x="-.08" y="-.08" width="1.16" height="1.2" color-interpolation-filters="sRGB">
