      <path d="m113 79 37 16-34 32Z" fill="#ee376f"/>
      <path d="m64 107 49-28 3 48Z" fill="#ff3545"/>
      <path d="m64 107 32-18-14 26Z" fill="#d82130"/>
      <path d="M18 97 70 68 59 151 18 178Z" fill="url(#px-gem-leg)"/>
      <path d="m18 97 52-29-27 67Z" fill="#ffc91b"/>
      <path d="m70 68-11 83-16-16Z" fill="#ff8d0e"/>
      <path d="m18 97 25 38-25 43Z" fill="#ffba08"/>
      <path d="m43 135 16 16-41 27Z" fill="#ff7511"/>
