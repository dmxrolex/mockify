    </g>
    <circle cx="256" cy="244" r="213" fill="url(#px-rim)" stroke="#f5cf61" stroke-width="1.5"/>
    <circle cx="256" cy="244" r="208.5" fill="none" stroke="#e7b245" stroke-width="1" opacity=".45"/>
    <circle cx="256" cy="244" r="193" fill="url(#px-bevel)"/>
    <circle cx="256" cy="244" r="188" fill="#a86607"/>
    <circle cx="256" cy="244" r="185.5" fill="#efc55b"/>
