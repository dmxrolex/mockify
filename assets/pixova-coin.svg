    <path id="px-bead" d="M256 47h.01" stroke="#ddab42" stroke-width="2.7" stroke-linecap="round"/>
    <path id="px-etch" d="m256 70-2.2 6.5h4.4Z" fill="#b5740b" opacity=".48"/>
    <path id="px-emblem" d="M54 6 154 59 153 103 116 127 64 107 113 79 39 41ZM18 97 70 68 59 151 18 178Z"/>
