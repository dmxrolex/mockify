<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="px-title px-desc">
  <title id="px-title">Pixova gold coin</title>
  <desc id="px-desc">A polished gold coin with a milled edge, engraved rings, and the faceted orange and pink Pixova emblem.</desc>
  <defs>
    <linearGradient id="px-edge" x1="55" y1="220" x2="442" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b96d08"/><stop offset=".22" stop-color="#ffdd60"/><stop offset=".43" stop-color="#bd6500"/><stop offset=".68" stop-color="#7c3500"/><stop offset=".88" stop-color="#e8a521"/><stop offset="1" stop-color="#9b4c03"/>
    </linearGradient>
    <linearGradient id="px-rim" x1="102" y1="63" x2="412" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fce087"/><stop offset=".14" stop-color="#f8d76a"/><stop offset=".27" stop-color="#e9a914"/><stop offset=".39" stop-color="#ffdc56"/><stop offset=".52" stop-color="#edbc46"/><stop offset=".64" stop-color="#f9c43b"/><stop offset=".81" stop-color="#d68a0b"/><stop offset=".91" stop-color="#eaba47"/><stop offset="1" stop-color="#b86a05"/>
    </linearGradient>
    <linearGradient id="px-bevel" x1="142" y1="91" x2="377" y2="411" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b96c08"/><stop offset=".28" stop-color="#eab029"/><stop offset=".55" stop-color="#ffec89"/><stop offset=".76" stop-color="#f3d473"/><stop offset="1" stop-color="#edc55a"/>
    </linearGradient>
    <radialGradient id="px-face" cx=".3" cy=".23" r=".93">
      <stop stop-color="#c48d22"/><stop offset=".31" stop-color="#ffdb58"/><stop offset=".67" stop-color="#efb327"/><stop offset="1" stop-color="#cf7f08"/>
    </radialGradient>
    <linearGradient id="px-face-light" x1="82" y1="128" x2="422" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffad0" stop-opacity=".47"/><stop offset=".45" stop-color="#fffad0" stop-opacity="0"/><stop offset="1" stop-color="#fff4b2" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="px-gem-top" x1="39" y1="8" x2="154" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff378"/><stop offset=".37" stop-color="#ffc719"/><stop offset=".72" stop-color="#ff8735"/><stop offset="1" stop-color="#ff4e79"/>
